html,body{background:#eef0f4;font-family:'Heebo','Assistant','Rubik','Noto Sans Hebrew','Arial Hebrew',Arial,sans-serif;color:var(--ink)}

.day{flex:1;display:flex;flex-direction:column;min-width:0}
.day.weekend .dhead{background:#f7f8fa}

.dhead,.track{flex:none}

.hline{position:absolute;left:0;right:0;height:1px;background:#f3f4f8}

.free{position:absolute;left:2px;right:2px;background:repeating-linear-gradient(-45deg,var(--free-bg),var(--free-bg) 6px,#fff 6px,#fff 12px);
  border:1.2px dashed var(--free-br);border-radius:5px;display:flex;align-items:center;justify-content:center}
.free span{font-size:9.5px;font-weight:700;color:var(--free);background:#fff;padding:1px 5px;border-radius:4px;font-variant-numeric:tabular-nums}

.blk{position:absolute;border-radius:5px;padding:4px 5px;overflow:hidden;display:flex;flex-direction:column;justify-content:center;line-height:1.2;cursor:pointer}
.blk b{font-size:10.6px;font-weight:700;display:block}
.blk i{font-size:9.2px;font-style:normal;opacity:.75;font-variant-numeric:tabular-nums;margin-top:1px}
.blk.tiny{padding:2px 4px}
.blk.mini{padding:2px 4px}
.blk.mini b{font-size:7.7px;line-height:1.08;font-weight:700}
.blk.tiny b{font-size:8.6px}
.blk.tiny i{font-size:7.6px}
.lane-itay{right:3px;width:calc(50% - 4px)}
.lane-mori{left:3px;width:calc(50% - 4px)}
.itay{background:var(--itay-bg);border:1.2px solid var(--itay-br);color:#12325f}
.mori{background:var(--mori-bg);border:1.2px solid var(--mori-br);color:#3b1d70}
.meeting{background:var(--meet-bg);color:#fff;border:1.2px solid #0b1220;z-index:3}

.flexnote{position:absolute;bottom:8px;left:6px;right:6px;text-align:center;font-size:9px;color:var(--muted);
  background:#fff;border:1px dashed #dfe3ea;border-radius:5px;padding:4px 2px;line-height:1.3}

footer{margin-top:16px;display:flex;justify-content:center;flex-wrap:wrap;gap:26px;align-items:center;font-size:9.5px;color:var(--muted)}

.ctl{display:flex;gap:9px;align-items:center;margin-top:7px}

<script>
(function(){
'use strict';

var DOW = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
var DOW_SHORT = ['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
var HE_MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
var WORK_START = 8*60, WORK_END = 23*60;
var BASE_WEEK_START = '2026-08-16';

var BASE_BUSY = {
  0: [ {type:'itay', start:'09:00', end:'17:00', label:'איתי — אבן קיסר'},
       {type:'mori', start:'09:00', end:'15:00', label:'מורי — עבודה'},
       {type:'meeting', start:'15:00', end:'15:30', label:'דביר / Flash'} ],
  1: [ {type:'mori', start:'09:00', end:'19:00', label:'מורי — משרד'},
       {type:'meeting', start:'15:00', end:'15:30', label:'מאיה רובין / Flash'},
       {type:'meeting', start:'16:30', end:'17:00', label:'אלון פינקלשטיין / Flash'} ],
  2: [ {type:'itay', start:'09:00', end:'17:00', label:'איתי — אבן קיסר'},
       {type:'mori', start:'09:00', end:'19:00', label:'מורי — משרד'} ],
  3: [ {type:'itay', start:'09:00', end:'17:00', label:'איתי — אבן קיסר'} ],
  4: [ {type:'meeting', start:'12:30', end:'13:00', label:'לישי כהן / Flash'},
       {type:'meeting', start:'16:30', end:'17:00', label:"ג'ונתן / Flash"} ],
  5: [],
  6: []
};
var BASE_NOTES = {
  1: 'מורי מסיים במשרד בין 18:00 ל‑19:00',
  2: 'מורי מסיים במשרד בין 18:00 ל‑19:00',
  3: 'מורי פנוי — רק איתי עסוק',
  5: 'שישי — שניהם פנויים',
  6: 'שבת — שניהם פנויים'
};

var addedEvents = loadJSON('cf.events.v1', {});
var removedBase = loadJSON('cf.removed.v1', {});
var weekStart = parseISO(loadJSON('cf.viewWeek', BASE_WEEK_START) || BASE_WEEK_START);
if(isNaN(weekStart.getTime())) weekStart = parseISO(BASE_WEEK_START);

function loadJSON(key, fallback){
  try{ var v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function saveJSON(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

function parseISO(iso){ var p = iso.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function toISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(d,n){ var r = new Date(d); r.setDate(r.getDate()+n); return r; }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function t2m(t){ var p = t.split(':').map(Number); return p[0]*60+p[1]; }
function m2t(m){ m = Math.max(0, Math.round(m)); var h = Math.floor(m/60), mm = m%60; return String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0'); }
function clampMin(m){ return Math.min(WORK_END, Math.max(WORK_START, m)); }
function px(min){ return Math.round(min*40/60*100)/100; }

function getDayBusy(weekISO, dayIdx){
  var list = [];
  if(weekISO === BASE_WEEK_START){
    var base = BASE_BUSY[dayIdx] || [];
    var removedIdx = (removedBase[weekISO] && removedBase[weekISO][dayIdx]) || [];
    base.forEach(function(b,i){ if(removedIdx.indexOf(i) === -1) list.push(Object.assign({}, b, {baseIndex:i})); });
  }
  var added = (addedEvents[weekISO] && addedEvents[weekISO][dayIdx]) || [];
  added.forEach(function(a){ list.push(a); });
  return list;
}
function addEvent(weekISO, dayIdx, ev){
  if(!addedEvents[weekISO]) addedEvents[weekISO] = {};
  if(!addedEvents[weekISO][dayIdx]) addedEvents[weekISO][dayIdx] = [];
  ev.id = 'e' + Date.now() + Math.random().toString(36).slice(2,7);
  addedEvents[weekISO][dayIdx].push(ev);
  saveJSON('cf.events.v1', addedEvents);
}
function removeEvent(weekISO, dayIdx, item){
  if(item.baseIndex !== undefined){
    if(!removedBase[weekISO]) removedBase[weekISO] = {};
    if(!removedBase[weekISO][dayIdx]) removedBase[weekISO][dayIdx] = [];
    removedBase[weekISO][dayIdx].push(item.baseIndex);
    saveJSON('cf.removed.v1', removedBase);
  } else if(item.id){
    var arr = (addedEvents[weekISO] && addedEvents[weekISO][dayIdx]) || [];
    var idx = arr.findIndex(function(x){ return x.id === item.id; });
    if(idx > -1){ arr.splice(idx,1); saveJSON('cf.events.v1', addedEvents); }
  }
}
function freeWindows(busy){
  var ivs = busy.map(function(b){ return [clampMin(t2m(b.start)), clampMin(t2m(b.end))]; }).filter(function(iv){ return iv[1] > iv[0]; });
  ivs.sort(function(a,b){ return a[0]-b[0]; });
  var merged = [];
  ivs.forEach(function(iv){
    if(merged.length && iv[0] <= merged[merged.length-1][1]) merged[merged.length-1][1] = Math.max(merged[merged.length-1][1], iv[1]);
    else merged.push(iv.slice());
  });
  var free = [], cur = WORK_START;
  merged.forEach(function(iv){
    if(iv[0] > cur) free.push([cur, iv[0]]);
    cur = Math.max(cur, iv[1]);
  });
  if(cur < WORK_END) free.push([cur, WORK_END]);
  return free;
}

function formatRangeHebrew(ws){
  var end = addDays(ws,6);
  var y1=ws.getFullYear(), y2=end.getFullYear(), m1=ws.getMonth(), m2=end.getMonth(), d1=ws.getDate(), d2=end.getDate();
  if(m1===m2 && y1===y2) return 'שבוע <span dir="ltr">'+d1+'&#8211;'+d2+'</span> ב'+HE_MONTHS[m1]+' '+y1;
  if(y1===y2) return 'שבוע <span dir="ltr">'+d1+'.'+(m1+1)+'&#8211;'+d2+'.'+(m2+1)+'</span> '+y1;
  return 'שבוע <span dir="ltr">'+d1+'.'+(m1+1)+'.'+y1+'&#8211;'+d2+'.'+(m2+1)+'.'+y2+'</span>';
}
function formatStamp(ws){
  var end = addDays(ws,6);
  if(ws.getMonth()===end.getMonth() && ws.getFullYear()===end.getFullYear())
    return ws.getDate()+'&#8211;'+end.getDate()+'.'+(end.getMonth()+1)+'.'+end.getFullYear();
  return ws.getDate()+'.'+(ws.getMonth()+1)+'&#8211;'+end.getDate()+'.'+(end.getMonth()+1)+'.'+end.getFullYear();
}
function formatShort(ws){
  var end = addDays(ws,6);
  return ws.getDate()+'.'+(ws.getMonth()+1)+'–'+end.getDate()+'.'+(end.getMonth()+1);
}

function renderDesktopDay(dayIdx, date, weekISO){
  var busy = getDayBusy(weekISO, dayIdx);
  var free = freeWindows(busy);
  var weekend = dayIdx >= 5;
  var html = '<div class="day'+(weekend?' weekend':'')+'">';
  html += '<div class="dhead"><span class="dname">'+DOW[dayIdx]+'</span><span class="ddate">'+date.getDate()+'.'+(date.getMonth()+1)+'</span>'
        + '<button type="button" class="addbtn" data-day="'+dayIdx+'" title="הוספת זמן">+</button></div>';
  html += '<div class="track" style="height:600px">';
  for(var h = WORK_START; h <= WORK_END; h += 60){ html += '<div class="hline" style="top:'+px(h-WORK_START)+'px"></div>'; }
  free.forEach(function(f){
    var top = px(f[0]-WORK_START), height = px(f[1]-f[0]);
    var tiny = (f[1]-f[0]) <= 75 ? ' tiny' : '';
    html += '<div class="free'+tiny+'" style="top:'+top+'px;height:'+height+'px"><span dir="ltr">'+m2t(f[0])+'&#8211;'+m2t(f[1])+'</span></div>';
  });
  busy.forEach(function(b){
    var s = clampMin(t2m(b.start)), e = clampMin(t2m(b.end));
    if(e <= s) return;
    var top = px(s-WORK_START), height = px(e-s);
    var lane = b.type === 'itay' ? 'lane-itay' : 'lane-mori';
    var sizeClass = height < 34 ? ' mini' : (height < 50 ? ' tiny' : '');
    var idAttr = b.baseIndex !== undefined ? ' data-base="'+b.baseIndex+'"' : ' data-id="'+b.id+'"';
    html += '<div class="blk '+b.type+' '+lane+sizeClass+'" data-day="'+dayIdx+'"'+idAttr+' title="'+esc(b.label+' · '+b.start+'-'+b.end)+'" style="top:'+top+'px;height:'+height+'px"><b>'+esc(b.label)+'</b>'
      + (sizeClass.indexOf('mini') > -1 ? '' : '<i dir="ltr">'+b.start+'&#8211;'+b.end+'</i>') + '</div>';
  });
  var note = weekISO === BASE_WEEK_START ? BASE_NOTES[dayIdx] : null;
  if(note) html += '<div class="flexnote">'+esc(note)+'</div>';
  html += '</div></div>';
  return html;
}

function renderMobileDay(dayIdx, date, weekISO){
  var busy = getDayBusy(weekISO, dayIdx).slice().sort(function(a,b){ return t2m(a.start)-t2m(b.start); });
  var free = freeWindows(busy);
  var items = busy.map(function(b){ return {t:t2m(b.start), cls:'w-'+b.type, label:b.label, start:b.start, endStr:b.end, kind:b.type, ref:b}; })
    .concat(free.map(function(f){ return {t:f[0], cls:'w-free', label:'פנוי לשניהם', start:m2t(f[0]), endStr:m2t(f[1]), kind:'free'}; }))
    .sort(function(a,b){ return a.t-b.t; });
  var freeMinutes = free.reduce(function(sum,f){ return sum + (f[1]-f[0]); }, 0);
  var busyMinutes = (WORK_END-WORK_START) - freeMinutes;
  var badge = busyMinutes === 0 ? 'פנוי לגמרי' : Math.round(busyMinutes/60) + ' שעות תפוסות';
  var weekend = dayIdx >= 5;
  var html = '<section class="card'+(weekend?' wk':'')+'"><h3><span>'+DOW[dayIdx]+'</span><small>'+date.getDate()+'.'+(date.getMonth()+1)+'</small><em>'+badge+'</em>'
    + '<button type="button" class="addbtn2" data-day="'+dayIdx+'" title="הוספת זמן">+</button></h3><ul>';
  items.forEach(function(it){
    var delBtn = '';
    if(it.kind !== 'free'){
      var idAttr = it.ref.baseIndex !== undefined ? ' data-base="'+it.ref.baseIndex+'"' : ' data-id="'+it.ref.id+'"';
      delBtn = '<button type="button" class="delbtn" data-day="'+dayIdx+'"'+idAttr+' title="מחיקה">×</button>';
    }
    html += '<li class="r '+it.cls+'"><span class="t" dir="ltr">'+it.start+'&#8211;'+it.endStr+'</span><span class="n">'+esc(it.label)+'</span>'+delBtn+'</li>';
  });
  html += '</ul></section>';
  return html;
}

function renderFooter(days){
  var bestParts = days.map(function(d){
    var totalFree = d.free.reduce(function(s,f){ return s+(f[1]-f[0]); }, 0);
    if(!d.free.length) return null;
    if(totalFree >= WORK_END-WORK_START) return DOW_SHORT[d.dayIdx]+' פתוח כל היום';
    if(totalFree >= 480) return DOW_SHORT[d.dayIdx]+' כמעט כל היום';
    var longest = d.free.reduce(function(a,b){ return (b[1]-b[0]) > (a[1]-a[0]) ? b : a; });
    if(longest[1] === WORK_END) return DOW_SHORT[d.dayIdx]+' מ‑<span dir="ltr">'+m2t(longest[0])+'</span>';
    return DOW_SHORT[d.dayIdx]+' <span dir="ltr">'+m2t(longest[0])+'&#8211;'+m2t(longest[1])+'</span>';
  }).filter(Boolean);
  var bestHtml = bestParts.length ? bestParts.join(' · ') : 'אין חלונות פנויים השבוע';

  var itayDays = [], moriDays = [];
  days.forEach(function(d){
    if(d.busy.some(function(b){ return b.type === 'itay'; })) itayDays.push(DOW_SHORT[d.dayIdx]);
    if(d.busy.some(function(b){ return b.type === 'mori'; })) moriDays.push(DOW_SHORT[d.dayIdx]);
  });
  var summaryParts = [];
  if(itayDays.length) summaryParts.push('איתי עסוק '+itayDays.join('·'));
  if(moriDays.length) summaryParts.push('מורי עסוק '+moriDays.join('·'));
  var summaryText = summaryParts.length ? summaryParts.join(' · ') : 'לא נוספו זמנים לשבוע הזה עדיין';

  document.getElementById('footerBest').innerHTML = 'חלונות הזהב לתיאום: '+bestHtml;
  document.getElementById('footerSummary').textContent = summaryText;
}

function renderWeek(){
  var weekISO = toISO(weekStart);
  document.getElementById('subText').innerHTML = formatRangeHebrew(weekStart)+' · שעון ישראל (GMT+3)';
  document.getElementById('sub2Text').innerHTML = formatRangeHebrew(weekStart)+' · שעון ישראל';
  document.getElementById('stampText').innerHTML = 'שבוע <span dir="ltr">'+formatStamp(weekStart)+'</span> · שעון ישראל';
  document.getElementById('weekRangeLabel').textContent = formatShort(weekStart);

  var daysData = [], deskHtml = '', mobHtml = '';
  for(var i = 0; i < 7; i++){
    var date = addDays(weekStart, i);
    var busy = getDayBusy(weekISO, i);
    var free = freeWindows(busy);
    daysData.push({dayIdx:i, busy:busy, free:free});
    deskHtml += renderDesktopDay(i, date, weekISO);
    mobHtml += renderMobileDay(i, date, weekISO);
  }
  document.getElementById('days').innerHTML = deskHtml;
  document.getElementById('mobDays').innerHTML = mobHtml;
  renderFooter(daysData);

  var isBase = weekISO === BASE_WEEK_START;
  document.getElementById('icsLink').style.display = isBase ? '' : 'none';
  document.getElementById('pdfLink').style.display = isBase ? '' : 'none';

  saveJSON('cf.viewWeek', weekISO);
  attachDayInteractions();
}

function attachDayInteractions(){
  document.querySelectorAll('.addbtn,.addbtn2').forEach(function(btn){
    btn.addEventListener('click', function(e){ e.stopPropagation(); openAdd(+btn.dataset.day); });
  });
  document.querySelectorAll('.blk[data-day]').forEach(function(el){
    el.addEventListener('click', function(){
      var day = +el.dataset.day;
      var labelEl = el.querySelector('b');
      var label = labelEl ? labelEl.textContent : 'האירוע';
      if(!confirm('למחוק את “'+label+'”?')) return;
      var item = el.hasAttribute('data-base') ? {baseIndex:+el.dataset.base} : {id: el.dataset.id};
      removeEvent(toISO(weekStart), day, item);
      renderWeek();
    });
  });
  document.querySelectorAll('.delbtn').forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var day = +btn.dataset.day;
      var row = btn.closest('.r');
      var label = row ? row.querySelector('.n').textContent : 'האירוע';
      if(!confirm('למחוק את “'+label+'”?')) return;
      var item = btn.hasAttribute('data-base') ? {baseIndex:+btn.dataset.base} : {id: btn.dataset.id};
      removeEvent(toISO(weekStart), day, item);
      renderWeek();
    });
  });
}

var addOverlay = document.getElementById('addOverlay');
function openAdd(dayIdx){
  var sel = document.getElementById('addDay');
  sel.innerHTML = '';
  for(var i = 0; i < 7; i++){
    var date = addDays(weekStart, i);
    var opt = document.createElement('option');
    opt.value = i;
    opt.textContent = DOW[i]+' ('+date.getDate()+'.'+(date.getMonth()+1)+')';
    if(i === dayIdx) opt.selected = true;
    sel.appendChild(opt);
  }
  document.getElementById('addLabel').value = '';
  document.getElementById('addStart').value = '09:00';
  document.getElementById('addEnd').value = '10:00';
  document.getElementById('addType').value = 'itay';
  addOverlay.hidden = false;
}
function closeAdd(){ addOverlay.hidden = true; }
document.getElementById('addCancel').addEventListener('click', closeAdd);
addOverlay.addEventListener('click', function(e){ if(e.target === addOverlay) closeAdd(); });
document.getElementById('addSave').addEventListener('click', function(){
  var day = +document.getElementById('addDay').value;
  var type = document.getElementById('addType').value;
  var start = document.getElementById('addStart').value;
  var end = document.getElementById('addEnd').value;
  var label = document.getElementById('addLabel').value.trim();
  if(!start || !end || t2m(end) <= t2m(start)){ alert('טווח השעות לא תקין'); return; }
  if(!label) label = type === 'itay' ? 'איתי' : (type === 'mori' ? 'מורי' : 'פגישה');
  addEvent(toISO(weekStart), day, {type:type, start:start, end:end, label:label});
  closeAdd();
  renderWeek();
});

document.getElementById('prevWeek').addEventListener('click', function(){ weekStart = addDays(weekStart, -7); renderWeek(); });
document.getElementById('nextWeek').addEventListener('click', function(){ weekStart = addDays(weekStart, 7); renderWeek(); });
document.getElementById('todayWeek').addEventListener('click', function(){ weekStart = parseISO(BASE_WEEK_START); renderWeek(); });

document.querySelectorAll('.ctl input').forEach(function(cb){
  cb.addEventListener('change', function(){
    document.querySelector('.page').classList.toggle('h-' + cb.dataset.k, !cb.checked);
  });
});

renderWeek();
})();
</script>
</body></html>
